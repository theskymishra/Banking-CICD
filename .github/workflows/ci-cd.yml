name: Banking Application CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run automated tests
        run: python3 -m pytest -v

  build-push-deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t "$DOCKERHUB_USERNAME/banking-app:$IMAGE_TAG" .

            - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/banking-app:$IMAGE_TAG"
          for attempt in 1 2 3; do
            if docker push "$IMAGE"; then
              exit 0
            fi
            echo "Docker push attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done
          echo "Docker push failed after 3 attempts."
          exit 1

      - name: Deploy to local Kubernetes
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/banking-app:$IMAGE_TAG"
          kubectl config use-context docker-desktop
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/banking-app banking-app="$IMAGE"
          kubectl rollout status deployment/banking-app --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment banking-app
          kubectl get pods -l app=banking-app
          kubectl get service banking-app-service

      - name: Log out from Docker Hub
        if: always()
        run: docker logout || true
